name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew build
      
    - name: Run Android lint
      run: ./gradlew :androidApp:lintDebug
      
    - name: Run shared lint
      run: ./gradlew :shared:lintDebug
      
    - name: Upload lint reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-reports
        path: |
          androidApp/build/reports/lint-results-debug.html
          shared/build/reports/lint-results-debug.html
        retention-days: 7
        
    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: |
          androidApp/build/reports/tests/
          shared/build/reports/tests/
        retention-days: 7
        
    - name: Build iOS framework
      run: |
        ./gradlew :shared:compileIosMainKotlinMetadata
        ./gradlew :shared:compileIosX64
        ./gradlew :shared:compileIosArm64
        ./gradlew :shared:compileIosSimulatorArm64